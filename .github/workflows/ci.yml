name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  frontend:
    name: Frontend (format + lint + test + build) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally not run on every push/PR — lint/type-check/
        # build are OS-independent and Windows runners are slow. Validate the
        # Windows Electron build on demand via the manual
        # release-windows.yml workflow. Re-add windows-latest here to restore
        # matrix CI.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --run
      - run: npm run electron:test-native
      - run: npm run build
      - run: npm run electron:smoke

  e2e:
    name: Native Markdown editor (Chromium E2E) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Four runners over a suite that is 38 minutes on one. The tests themselves are the whole job —
    # setup measured 55s — so the only lever is running fewer of them per runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      # `--only-shell` fetches the headless shell instead of the full headed Chromium; the suite
      # never runs headed. `--with-deps` stays — the system libraries are still needed.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          DOXMIND_PYTHON: python

  backend:
    name: Backend (ruff + pytest) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally not run on every push/PR — lint/type-check/
        # build are OS-independent and Windows runners are slow. Validate the
        # Windows Electron build on demand via the manual
        # release-windows.yml workflow. Re-add windows-latest here to restore
        # matrix CI.
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
