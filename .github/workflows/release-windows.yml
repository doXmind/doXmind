name: Release (Windows x64)

# Builds the Electron app for Windows and uploads the NSIS installer as a
# workflow artifact. Mirrors the local flow:
#   nvm use 22
#   npm ci
#   npm run build:sidecar:electron   (PyInstaller one-dir, doxmind-server.exe)
#   npm run build                    (Next static export -> out/)
#   electron-builder --win           (NSIS installer -> dist-electron/)
#
# Trigger: MANUAL ONLY (workflow_dispatch from the Actions tab).
#
# The installer is built UNSIGNED (CSC_IDENTITY_AUTO_DISCOVERY=false): there is
# no Windows code-signing certificate in CI, so SmartScreen will warn on first
# run. It is NOT published to the doXmind/releases feed because Windows
# auto-update (electron-updater) is not wired into electron/updater.js, which
# only drives the Squirrel.Mac autoUpdater. Download the artifact from the run.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the PyInstaller sidecar (one-dir)
        run: |
          python -m venv server/.venv
          server\.venv\Scripts\python -m pip install --upgrade pip
          server\.venv\Scripts\pip install -r server/requirements.txt pyinstaller
          npm run build:sidecar:electron

      - name: Install JS deps
        run: npm ci

      - name: Build the renderer (static export)
        run: npm run build

      - name: Build the Windows installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: doXmind-windows-x64
          path: dist-electron/*-setup.exe
          if-no-files-found: error
