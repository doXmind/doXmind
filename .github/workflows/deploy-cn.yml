name: Deploy CN

on:
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: "Skip frontend rebuild (backend-only deploy)"
        required: false
        default: "false"
        type: boolean
      skip_backend:
        description: "Skip backend rebuild (frontend-only deploy)"
        required: false
        default: "false"
        type: boolean

permissions:
  checks: read
  contents: read

concurrency:
  group: deploy-cn
  cancel-in-progress: false # Never cancel in-progress deployments

jobs:
  # ============================================================================
  # Deploy Frontend + Backend to Alibaba Cloud ECS (CN)
  # ============================================================================
  deploy-cn:
    name: Deploy to Alibaba Cloud ECS (CN)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CN_SSH_KEY }}" > ~/.ssh/cn_key
          chmod 600 ~/.ssh/cn_key
          ssh-keyscan -H ${{ secrets.CN_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host cn-server
            HostName ${{ secrets.CN_HOST }}
            User ${{ secrets.CN_USER }}
            IdentityFile ~/.ssh/cn_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF

      - name: Sync server code
        run: |
          rsync -avz --delete \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='data/' \
            --exclude='*.db' \
            --exclude='*.sqlite' \
            ./server/ cn-server:/opt/doxmind/server/

      - name: Sync frontend source
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git/' \
            --exclude='server/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage/' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            ./ cn-server:/opt/doxmind/frontend-src/

      - name: Sync infrastructure files
        run: |
          scp ./docker-compose.prod.yml cn-server:/opt/doxmind/docker-compose.prod.yml
          rsync -avz ./nginx/ cn-server:/opt/doxmind/nginx/
          rsync -avz ./scripts/ cn-server:/opt/doxmind/scripts/ 2>/dev/null || true

      - name: Upload deploy script
        run: |
          cat > /tmp/deploy-cn.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          DEPLOY_DIR="/opt/doxmind"
          COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"
          SKIP_FRONTEND="${SKIP_FRONTEND:-false}"
          SKIP_BACKEND="${SKIP_BACKEND:-false}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          LOG_FILE="${DEPLOY_DIR}/logs/deploy_${TIMESTAMP}.log"

          mkdir -p "${DEPLOY_DIR}/logs"

          log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"
          }

          cd "$DEPLOY_DIR"
          log "=== CN Deployment started ==="
          log "Skip frontend: $SKIP_FRONTEND | Skip backend: $SKIP_BACKEND"

          # ==================================================================
          # Phase 1: Backend
          # ==================================================================
          if [ "$SKIP_BACKEND" = "false" ]; then
              log "--- Phase 1: Backend deployment ---"

              log "Tagging current backend image as rollback target..."
              docker tag doxmind-backend:latest doxmind-backend:previous 2>/dev/null || true

              log "Building new backend image..."
              $COMPOSE build --no-cache backend

              log "Running database migrations..."
              if ! $COMPOSE run --rm backend alembic upgrade head; then
                  log "ERROR: Database migration failed! Aborting deployment."
                  docker tag doxmind-backend:previous doxmind-backend:latest 2>/dev/null || true
                  exit 1
              fi

              log "Restarting backend..."
              $COMPOSE up -d --force-recreate backend

              log "Waiting for backend health check..."
              for i in $(seq 1 30); do
                  if docker exec doxmind-backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                      log "Backend is healthy! (attempt $i/30)"
                      break
                  fi
                  if [ "$i" -eq 30 ]; then
                      log "ERROR: Backend health check failed after 30 attempts!"
                      docker logs doxmind-backend --tail 50 >> "$LOG_FILE" 2>&1
                      log "Rolling back backend..."
                      docker tag doxmind-backend:previous doxmind-backend:latest 2>/dev/null || true
                      $COMPOSE up -d --force-recreate backend
                      exit 1
                  fi
                  log "Waiting for backend... ($i/30)"
                  sleep 2
              done
          else
              log "--- Phase 1: Backend SKIPPED ---"
          fi

          # ==================================================================
          # Phase 2: Frontend
          # ==================================================================
          if [ "$SKIP_FRONTEND" = "false" ]; then
              log "--- Phase 2: Frontend deployment ---"

              log "Tagging current frontend image as rollback target..."
              docker tag doxmind-frontend:latest doxmind-frontend:previous 2>/dev/null || true

              log "Syncing frontend source into build context..."
              rsync -a --delete \
                  --exclude='server/' \
                  --exclude='.env.production' \
                  --exclude='frontend-src/' \
                  --exclude='logs/' \
                  --exclude='backups/' \
                  --exclude='data/' \
                  --exclude='deploy-cn.sh' \
                  --exclude='deploy.sh' \
                  "${DEPLOY_DIR}/frontend-src/" "${DEPLOY_DIR}/"

              log "Building new frontend image (this may take 3-5 minutes)..."
              $COMPOSE build --no-cache frontend

              log "Restarting frontend..."
              $COMPOSE up -d --force-recreate frontend

              log "Waiting for frontend health check..."
              for i in $(seq 1 30); do
                  STATUS=$(docker inspect --format='{{.State.Health.Status}}' doxmind-frontend 2>/dev/null || echo "unknown")
                  if [ "$STATUS" = "healthy" ]; then
                      log "Frontend is healthy! (attempt $i/30)"
                      break
                  fi
                  if [ "$i" -eq 30 ]; then
                      log "ERROR: Frontend health check failed after 30 attempts!"
                      docker logs doxmind-frontend --tail 50 >> "$LOG_FILE" 2>&1
                      log "Rolling back frontend..."
                      docker tag doxmind-frontend:previous doxmind-frontend:latest 2>/dev/null || true
                      $COMPOSE up -d --force-recreate frontend
                      exit 1
                  fi
                  log "Waiting for frontend... ($i/30)"
                  sleep 3
              done
          else
              log "--- Phase 2: Frontend SKIPPED ---"
          fi

          # ==================================================================
          # Phase 3: Finalize
          # ==================================================================
          log "--- Phase 3: Finalize ---"

          log "Reloading nginx..."
          docker exec doxmind-nginx nginx -s reload 2>/dev/null || true

          log "Cleaning up..."
          docker image prune -f
          rm -rf "${DEPLOY_DIR}/frontend-src"

          log "=== CN Deployment complete ==="
          log "Frontend: https://cn.doxmind.com"
          log "Backend:  https://cn.api.doxmind.com"

          docker ps --format "table {{.Names}}\t{{.Status}}" | grep doxmind
          SCRIPT
          scp /tmp/deploy-cn.sh cn-server:/opt/doxmind/deploy-cn.sh

      - name: Execute deployment
        run: |
          ssh cn-server "chmod +x /opt/doxmind/deploy-cn.sh && \
            SKIP_FRONTEND=${{ inputs.skip_frontend || 'false' }} \
            SKIP_BACKEND=${{ inputs.skip_backend || 'false' }} \
            bash /opt/doxmind/deploy-cn.sh"

      - name: Verify deployment
        if: success()
        run: |
          echo "Verifying CN deployment..."
          BACKEND_OK=$(ssh cn-server "curl -sf http://localhost:8000/health 2>/dev/null && echo OK || echo FAIL")
          FRONTEND_OK=$(ssh cn-server "docker inspect --format='{{.State.Health.Status}}' doxmind-frontend 2>/dev/null || echo unknown")
          echo "Backend:  $BACKEND_OK"
          echo "Frontend: $FRONTEND_OK"
          if [ "$FRONTEND_OK" != "healthy" ]; then
            echo "::warning::Frontend health status: $FRONTEND_OK"
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::CN deployment failed!"
          echo "SSH into the server to investigate:"
          echo "  ssh -i ~/.ssh/doxmind.pem root@<CN_HOST>"
          echo "  cat /opt/doxmind/logs/deploy_*.log | tail -100"
          echo ""
          echo "Manual rollback:"
          echo "  cd /opt/doxmind"
          echo "  docker tag doxmind-backend:previous doxmind-backend:latest"
          echo "  docker tag doxmind-frontend:previous doxmind-frontend:latest"
          echo "  docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate"
