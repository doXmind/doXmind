name: Release (macOS arm64)

# Candidate mode builds, signs, notarizes, and uploads one draft to the public
# doXmind/releases repo. Publication mode only verifies and publishes those
# exact existing bytes; it never rebuilds or replaces a candidate.
#
# Trigger: MANUAL ONLY (workflow_dispatch from the Actions tab). Releases are
# normally built locally via `npm run dist:electron` on the maintainer's signing
# machine. This workflow is kept as a fallback and is deliberately NOT wired to
# tag pushes, so pushing a `vX.Y.Z` release tag does not kick off a redundant
# CI build.
#
# Required repository secrets:
#   CSC_LINK                  base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD          password for that .p12
#   APPLE_ID                  Apple ID email (notarization)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID             Apple Developer Team ID (46KF5Z549N)
#   RELEASES_TOKEN            PAT with `repo` scope on doXmind/releases
#                             (the default GITHUB_TOKEN can't push to another repo)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified draft as latest after all release gates pass
        required: true
        default: false
        type: boolean

concurrency:
  group: doxmind-macos-release
  cancel-in-progress: false

jobs:
  release:
    # PyInstaller must run natively on arm64 for the bundled sidecar. Publication
    # mode only verifies bytes, so it can use the standard runner.
    runs-on: ${{ inputs.publish && 'macos-14' || 'macos-14-xlarge' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: ${{ ! inputs.publish }}
        with:
          python-version: "3.12"

      - name: Build the PyInstaller sidecar (one-dir)
        if: ${{ ! inputs.publish }}
        run: |
          test "$(uname -m)" = "arm64"
          python3.12 -m venv server/.venv
          server/.venv/bin/pip install --upgrade pip
          server/.venv/bin/pip install -r server/requirements.txt pyinstaller
          npm run build:sidecar:electron

      - name: Install JS deps
        if: ${{ ! inputs.publish }}
        run: npm ci

      - name: Build the renderer (static export)
        if: ${{ ! inputs.publish }}
        run: npm run build

      - name: Build, sign, and notarize candidate
        if: ${{ ! inputs.publish }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish never

      - name: Upload candidate bytes to draft
        if: ${{ ! inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          cp "dist-electron/doXmind-${VERSION}-arm64.dmg" \
            "dist-electron/doXmind-mac-arm64.dmg"
          EXPECTED=(
            "doXmind-${VERSION}-arm64-mac.zip"
            "doXmind-${VERSION}-arm64-mac.zip.blockmap"
            "doXmind-${VERSION}-arm64.dmg"
            "doXmind-${VERSION}-arm64.dmg.blockmap"
            "doXmind-mac-arm64.dmg"
            "latest-mac.yml"
          )

          if gh release view "${TAG}" --repo doXmind/releases >/dev/null 2>&1; then
            test "$(gh release view "${TAG}" --repo doXmind/releases \
              --json isDraft --jq '.isDraft')" = "true"
          else
            gh release create "${TAG}" \
              --repo doXmind/releases \
              --draft \
              --title "doXmind ${VERSION}"
          fi

          while IFS= read -r asset; do
            keep=false
            for expected in "${EXPECTED[@]}"; do
              if test "${asset}" = "${expected}"; then keep=true; break; fi
            done
            if test "${keep}" = "false"; then
              gh release delete-asset "${TAG}" "${asset}" \
                --repo doXmind/releases --yes
            fi
          done < <(gh release view "${TAG}" --repo doXmind/releases \
            --json assets --jq '.assets[].name')

          ARTIFACTS=()
          for expected in "${EXPECTED[@]}"; do
            ARTIFACTS+=("dist-electron/${expected}")
          done
          gh release upload "${TAG}" "${ARTIFACTS[@]}" \
            --repo doXmind/releases --clobber

          echo "Candidate ${TAG} now points to source ${GITHUB_SHA}."
          echo "Any earlier hashes, quarantine results, or approval are invalid."

      - name: Validate publication gate
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          VERSION="$(node -p "require('./package.json').version")"
          CHECKLIST="docs/releases/${VERSION}-checklist.md"
          NOTES="docs/releases/${VERSION}.md"
          MANIFEST="docs/releases/${VERSION}-artifacts.sha256"
          grep -qx 'Status: READY TO PUBLISH' "${CHECKLIST}"
          ! grep -Eq 'Pending release validation|^- \[ \]' "${CHECKLIST}"
          ! grep -Eq 'Pending release validation|Not yet (designated|recorded)' "${NOTES}"
          test -f "${MANIFEST}"

      - name: Download and verify existing draft
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          MANIFEST="docs/releases/${VERSION}-artifacts.sha256"
          test "$(gh release view "${TAG}" --repo doXmind/releases \
            --json isDraft --jq '.isDraft')" = "true"

          EXPECTED="$(printf '%s\n' \
            "doXmind-${VERSION}-arm64-mac.zip" \
            "doXmind-${VERSION}-arm64-mac.zip.blockmap" \
            "doXmind-${VERSION}-arm64.dmg" \
            "doXmind-${VERSION}-arm64.dmg.blockmap" \
            "doXmind-mac-arm64.dmg" \
            "latest-mac.yml" | LC_ALL=C sort)"
          ACTUAL="$(gh release view "${TAG}" --repo doXmind/releases \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if test "${ACTUAL}" != "${EXPECTED}"; then
            echo "Draft asset set does not match the six verified release files." >&2
            diff <(printf '%s\n' "${EXPECTED}") <(printf '%s\n' "${ACTUAL}") || true
            exit 1
          fi

          RELEASE_ASSET_DIR="${RUNNER_TEMP}/doxmind-${VERSION}-release-assets"
          mkdir -p "${RELEASE_ASSET_DIR}"
          gh release download "${TAG}" \
            --repo doXmind/releases \
            --dir "${RELEASE_ASSET_DIR}"
          node scripts/verify-release-artifacts.mjs \
            "${RELEASE_ASSET_DIR}" "${MANIFEST}" "${VERSION}"

      # Publishing changes only GitHub release visibility. All six assets,
      # including the fixed-name website DMG, were uploaded and verified while
      # the release was still a draft.
      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          MANIFEST="docs/releases/${VERSION}-artifacts.sha256"
          test "$(gh release view "${TAG}" --repo doXmind/releases \
            --json isDraft --jq '.isDraft')" = "true"
          EXPECTED_DIGESTS="$(LC_ALL=C sort "${MANIFEST}")"
          REMOTE_DIGESTS="$(gh release view "${TAG}" --repo doXmind/releases \
            --json assets \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | \
            LC_ALL=C sort)"
          test "${REMOTE_DIGESTS}" = "${EXPECTED_DIGESTS}"
          gh release edit "${TAG}" \
            --repo doXmind/releases \
            --notes-file "docs/releases/${VERSION}.md" \
            --draft=false \
            --latest \
            --target main
