name: Release (macOS arm64)

# Builds, signs, notarizes, and publishes the Electron app to the public
# doXmind/releases repo — the same flow as `npm run release:electron` locally,
# but using APPLE_* secrets instead of the local keychain profile.
#
# Trigger: MANUAL ONLY (workflow_dispatch from the Actions tab). Releases are
# cut locally via `npm run release:electron` on the maintainer's signing
# machine; this workflow is kept as a fallback and is deliberately NOT wired to
# tag pushes, so pushing a `vX.Y.Z` release tag does not kick off a (redundant)
# CI build.
#
# Required repository secrets:
#   CSC_LINK                  base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD          password for that .p12
#   APPLE_ID                  Apple ID email (notarization)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID             Apple Developer Team ID (46KF5Z549N)
#   RELEASES_TOKEN            PAT with `repo` scope on doXmind/releases
#                             (the default GITHUB_TOKEN can't push to another repo)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14 # arm64 runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the PyInstaller sidecar (one-dir)
        run: |
          python3.12 -m venv server/.venv
          server/.venv/bin/pip install --upgrade pip
          server/.venv/bin/pip install -r server/requirements.txt pyinstaller
          npm run build:sidecar:electron

      - name: Install JS deps
        run: npm ci

      - name: Build the renderer (static export)
        run: npm run build

      - name: Build, sign, notarize, and upload (draft)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish always

      # The versioned DMG remains the canonical release artifact. Upload a
      # fixed-name copy as well so doxmind.com can link to the latest release
      # without hard-coding a version number.
      - name: Upload stable website download
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cp "dist-electron/doXmind-${VERSION}-arm64.dmg" "dist-electron/doXmind-mac-arm64.dmg"
          gh release upload "v${VERSION}" "dist-electron/doXmind-mac-arm64.dmg" \
            --repo doXmind/releases \
            --clobber

      # electron-builder uploads to a DRAFT release (the releases repo has no
      # pre-existing tag). Publish it so update.electronjs.org serves it: this
      # creates the tag against main and marks it latest.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release edit "v${VERSION}" --repo doXmind/releases --draft=false --latest --target main
