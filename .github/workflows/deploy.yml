name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Deploy Frontend to Heroku
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to Heroku
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git remote add heroku-frontend https://heroku:$HEROKU_API_KEY@git.heroku.com/${{ secrets.HEROKU_FRONTEND_APP }}.git 2>/dev/null || true
          git push heroku-frontend main:main --force

  # ============================================================================
  # Deploy Backend to AWS EC2
  # ============================================================================
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync server code to EC2
        run: |
          rsync -avz --delete \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./server/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/doxmind/server/

      - name: Sync infrastructure files to EC2
        run: |
          scp ./docker-compose.prod.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/doxmind/docker-compose.prod.yml
          rsync -avz ./nginx/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/doxmind/nginx/
          rsync -avz ./scripts/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/doxmind/scripts/

      - name: Upload deploy script
        run: |
          cat > /tmp/deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          cd /opt/doxmind

          echo "=== Tagging current image as rollback ==="
          docker tag doxmind-backend:latest doxmind-backend:previous 2>/dev/null || true

          echo "=== Building new backend image ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml build backend

          echo "=== Running database migrations ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend alembic upgrade head

          echo "=== Restarting backend ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate backend

          echo "=== Waiting for health check ==="
          for i in $(seq 1 30); do
            if docker exec doxmind-backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Health check failed after 30 attempts!"
              echo "=== Backend logs ==="
              docker logs doxmind-backend --tail 50
              exit 1
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

          echo "=== Reloading nginx ==="
          docker exec doxmind-nginx nginx -s reload 2>/dev/null || true

          echo "=== Cleaning up old Docker images ==="
          docker image prune -f

          echo "=== Deployment complete ==="
          SCRIPT
          scp /tmp/deploy.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/doxmind/deploy.sh

      - name: Build, migrate, and deploy
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "chmod +x /opt/doxmind/deploy.sh && bash /opt/doxmind/deploy.sh"

  # ============================================================================
  # Notify on Completion
  # ============================================================================
  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: |
      always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Check deployment status
        run: |
          echo "Frontend deployment: ${{ needs.deploy-frontend.result }}"
          echo "Backend deployment: ${{ needs.deploy-backend.result }}"

          if [ "${{ needs.deploy-frontend.result }}" != "success" ] || [ "${{ needs.deploy-backend.result }}" != "success" ]; then
            echo "One or more deployments failed!"
            exit 1
          fi

          echo "All deployments successful!"
          echo "Frontend: https://beta.doxmind.com"
          echo "Backend: https://api.doxmind.com"
