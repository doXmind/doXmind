name: Bug report
description: Report a reproducible problem in the local desktop app.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private workspace files, credentials, or security details.
        Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: doXmind version
      placeholder: "1.10.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reproducible workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Apple silicon model, and relevant file type.
