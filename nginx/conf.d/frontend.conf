# Upstream frontend (Next.js)
upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# =============================================================================
# HTTP → HTTPS redirect + Let's Encrypt ACME challenge
# =============================================================================
server {
    listen 80;
    server_name cn.doxmind.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS server - Frontend
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name cn.doxmind.com;

    # SSL certificates (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/cn.doxmind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cn.doxmind.com/privkey.pem;

    # SSL configuration (modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Client body size (for file uploads proxied through Next.js)
    client_max_body_size 55M;

    # Proxy timeouts (SSE streams can be long-lived)
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_connect_timeout 10s;

    # =========================================================================
    # All requests → Next.js frontend
    # =========================================================================
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (for /api/chat/stream, /api/global-agent/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
