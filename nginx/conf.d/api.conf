# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Upstream backend
upstream backend {
    server backend:8000;
    keepalive 32;
}

# =============================================================================
# HTTP → HTTPS redirect + Let's Encrypt ACME challenge
# =============================================================================
server {
    listen 80;
    server_name api.doxmind.com;

    # Health check (for Docker healthcheck, no redirect)
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS server
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.doxmind.com;

    # SSL certificates (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/api.doxmind.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.doxmind.com/privkey.pem;

    # SSL configuration (modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling (disabled - Let's Encrypt OCSP may not always be available)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Client body size (for file uploads - aligns with FastAPI's limits)
    client_max_body_size 55M;

    # Proxy timeouts (SSE streams can be long-lived, streaming_timeout_seconds=300)
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_connect_timeout 10s;

    # =========================================================================
    # Health check endpoint (bypass rate limiting)
    # =========================================================================
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # All API requests
    # =========================================================================
    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (critical for chat streaming, edit streaming, autocomplete)
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # WebSocket support (future-proofing)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
