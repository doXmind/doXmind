[package]
name = "doxmind"
version = "1.0.0"
description = "doXmind — local-first Markdown workspace"
authors = ["doXmind"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "doxmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "doxmind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doxmind-sidecar = { path = "../crates/sidecar" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
window-vibrancy = "0.6"
uuid = { version = "1", features = ["v4"] }
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSEvent",
    "NSWorkspace",
    "NSPrintInfo",
    "NSPrintOperation",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSString",
    "NSGeometry",
    "NSURL",
] }
