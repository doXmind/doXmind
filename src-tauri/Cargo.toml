[package]
name = "doxmind"
version = "0.1.0"
description = "doXmind — local-first AI writing studio"
authors = ["doXmind"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "doxmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "doxmind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
