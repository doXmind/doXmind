[package]
name = "doxmind"
version = "1.1.3"
description = "doXmind — local-first Markdown workspace"
authors = ["doXmind"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "doxmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "doxmind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doxmind-sidecar = { path = "../crates/sidecar" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
window-vibrancy = "0.6"
uuid = { version = "1", features = ["v4"] }
trash = "5"

[features]
# Enables tests that spawn `python3` to verify byte-identical sidecar
# round-trips between the Rust desktop runtime and the Python sidecar
# service. Off by default so plain `cargo test` does not depend on
# `python3` being on PATH or `server/` being reachable.
cross-runtime-tests = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSEvent",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSString",
    "NSGeometry",
    "NSURL",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Used to flip FILE_ATTRIBUTE_HIDDEN on `.doxmind` sidecars after atomic
# writes — Windows doesn't honor the POSIX leading-dot hidden convention,
# so without this the sidecars show up next to user documents in Explorer.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
