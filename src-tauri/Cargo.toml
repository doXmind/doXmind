[package]
name = "doxmind"
version = "0.1.0"
description = "doXmind — local-first AI writing studio"
authors = ["doXmind"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "doxmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "doxmind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doxmind-sidecar = { path = "../crates/sidecar" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
window-vibrancy = "0.6"
