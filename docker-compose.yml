version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: doxmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doxmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doxmind123}
      POSTGRES_DB: ${POSTGRES_DB:-doxmind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doxmind} -d ${POSTGRES_DB:-doxmind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:1.0.0
    container_name: doxmind-chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: doxmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-doxmind}:${POSTGRES_PASSWORD:-doxmind123}@postgres:5432/${POSTGRES_DB:-doxmind}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: doxmind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SKIP_AUTH=true
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: npm run dev

volumes:
  postgres_data:
  chroma_data:

networks:
  default:
    name: doxmind-network
