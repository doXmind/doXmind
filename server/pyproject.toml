[project]
name = "doxmind-backend"
version = "1.0.0"
description = "doXmind - Local Writing Studio Backend"
requires-python = ">=3.11"

# The `doxmind` CLI (ADR 0010). Full packaging — build backend, package
# discovery, and the standalone `doxmind-mcp` entry — lands with distribution
# (S9, #184); this declares the entry point so it is recorded from the start.
[project.scripts]
doxmind = "cli.__main__:main"
doxmind-mcp = "doxmind_mcp.server:main"

[tool.ruff]
# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "data",
]

# Line length
line-length = 100

# Target Python version
target-version = "py311"

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # Within an `except` clause, raise exceptions with `raise ... from err`
    "ARG001", # Unused function argument (common in FastAPI)
    "SIM108", # Use ternary operator (prefer readable if-else blocks)
    "SIM117", # Use single with statement (nested with is more readable for complex mocks)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["api", "db", "services", "middleware"]

[tool.ruff.lint.per-file-ignores]
# Ignore unused arguments in tests (mock parameters are required by decorators)
"tests/*" = ["ARG002", "ARG005"]
# conftest.py needs to set environment variables before imports
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    "__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
