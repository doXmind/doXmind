[project]
name = "doxmind-backend"
version = "1.0.0"
description = "doXmind - Local Writing Studio Backend"
requires-python = ">=3.11"

# Runtime dependencies for the installable `doxmind` / `doxmind-mcp` shells
# (ADR 0010). Kept in sync with requirements.txt, which remains the source for
# the desktop sidecar's pinned dev environment; test-only deps stay there.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-dotenv==1.0.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
    "python-multipart==0.0.19",
    "httpx==0.28.1",
    "markdown==3.7",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.5",
    "send2trash>=1.8.3",
    "orjson>=3.10.0",
    "typer==0.26.7",
    "mcp==1.27.2",
]

# The standalone shells (ADR 0010). `doxmind` is the document toolkit CLI;
# `doxmind-mcp` is the stdio MCP server. Installable with pip / pipx / uvx;
# PyInstaller specs in packaging/ produce no-Python binaries.
[project.scripts]
doxmind = "cli.__main__:main"
doxmind-mcp = "doxmind_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout: the backend keeps its packages and a few modules at the root, so
# discovery is listed explicitly (auto-discovery rejects multiple top-level
# packages). `tests` is intentionally omitted.
[tool.setuptools]
packages = ["api", "cli", "core", "db", "doxmind_mcp", "lib", "services"]
py-modules = ["config", "dependencies", "exceptions", "main", "run_sidecar"]

[tool.ruff]
# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "data",
]

# Line length
line-length = 100

# Target Python version
target-version = "py311"

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # Within an `except` clause, raise exceptions with `raise ... from err`
    "ARG001", # Unused function argument (common in FastAPI)
    "SIM108", # Use ternary operator (prefer readable if-else blocks)
    "SIM117", # Use single with statement (nested with is more readable for complex mocks)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix-style line endings
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["api", "db", "services", "middleware"]

[tool.ruff.lint.per-file-ignores]
# Ignore unused arguments in tests (mock parameters are required by decorators)
"tests/*" = ["ARG002", "ARG005"]
# conftest.py needs to set environment variables before imports
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    "__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
