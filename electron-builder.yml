# electron-builder config for the primary Electron release shell.
#
# Build:  npm run dist:electron
#         (the Next static export is built first — see package.json)
# Local unsigned test pack:
#         CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --publish never
#
# Auto-update: the zip target is the Squirrel.Mac update payload. Publishing the
# verified assets to the public `doXmind/releases` repo is all the server-side
# that update.electronjs.org needs. Keep that destination in sync with
# UPDATE_REPO in electron/updater.js and `.github/workflows/release.yml`.
# The generic provider below exists only so electron-builder emits fresh update
# metadata. Generic publishing never uploads for us; the release workflow owns
# the explicit draft upload after verification.

appId: com.doxmind.desktop
productName: doXmind
copyright: doXmind

directories:
  output: dist-electron

# Electron's stock macOS plist declares arbitrary network and device access.
# Rewrite it after packing and before signing to keep only loopback renderer HTTP.
afterPack: electron/harden-info-plist.js

# Notarize the signed .app before it is zipped (see electron/notarize.js).
afterSign: electron/notarize.js

# The renderer is a static export (out/) served in-process; no production npm
# dependency is required at runtime, so keep node_modules out of the asar.
files:
  - electron/**/*
  - out/**/*
  - electron/assets/icon.png
  - electron/assets/tray-icon-template.png
  - package.json
  - "!node_modules/**/*"
  - "!electron/harden-info-plist.js"
  - "!electron/notarize.js"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: electron/assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # Notarization runs in the afterSign hook (electron/notarize.js) so it can use
  # the local keychain profile OR APPLE_* env secrets in CI. electron-builder's
  # built-in notarize is left off to avoid forcing the env-var path.
  notarize: false
  fileAssociations:
    - ext: [md, markdown]
      name: Markdown Document
      role: Editor
      rank: Owner
    - ext: [pdf]
      name: PDF Document
      role: Viewer
      rank: Alternate
    - ext: [xlsx, xlsm, csv]
      name: Spreadsheet
      role: Viewer
      rank: Alternate

dmg:
  artifactName: doXmind-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/assets/icon.ico
  fileAssociations:
    - ext: md
      name: Markdown Document
      role: Editor
    - ext: markdown
      name: Markdown Document
      role: Editor
    - ext: pdf
      name: PDF Document
      role: Viewer
    - ext: xlsx
      name: Spreadsheet
      role: Viewer
    - ext: xlsm
      name: Spreadsheet
      role: Viewer
    - ext: csv
      name: Spreadsheet
      role: Viewer

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  artifactName: doXmind-${version}-${arch}-setup.${ext}
  shortcutName: doXmind

publish:
  provider: generic
  url: https://github.com/doXmind/releases/releases/latest/download
